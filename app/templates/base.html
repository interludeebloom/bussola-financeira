<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bússola Financeira</title>
  <style>
    :root {
      --bg: #f4f6f5;
      --surface: #ffffff;
      --border: #dde3e0;
      --text: #16211d;
      --muted: #5b6b64;
      --accent: #0e6e5a;
      --accent-soft: #dceee8;
      --danger: #b3261e;
      --danger-soft: #fdecea;
      --radius: 10px;
      --shadow: 0 1px 2px rgba(16, 33, 29, 0.06);
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 960px;
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
      line-height: 1.5;
    }

    h1 { margin: 1.6rem 0 0.2rem; font-size: 1.6rem; }
    h1 a { color: var(--text); text-decoration: none; }
    h2 { font-size: 1.3rem; margin: 0 0 1rem; }
    h3 { font-size: 1.05rem; margin: 0 0 0.7rem; }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem;
      padding: 0.75rem 0 1.4rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.6rem;
    }

    nav a {
      text-decoration: none;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.92rem;
      padding-bottom: 0.3rem;
      border-bottom: 2px solid transparent;
    }

    nav a:hover, nav a.active { color: var(--accent); border-color: var(--accent); }

    a { color: var(--accent); }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      margin-top: 0.5rem;
    }

    th, td { text-align: left; padding: 0.6rem 0.8rem; border-bottom: 1px solid var(--border); font-size: 0.92rem; }
    thead th { background: var(--accent-soft); color: var(--accent); font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.04em; }
    tbody tr:last-child td { border-bottom: none; }

    form.inline { display: inline; }

    button, .btn {
      font: inherit;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    button:hover { background: #0a5445; }

    input, select {
      font: inherit;
      padding: 0.4rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
    }

    label { display: block; margin-bottom: 0.9rem; font-size: 0.86rem; color: var(--muted); }
    label input, label select { display: block; margin-top: 0.3rem; color: var(--text); }

    .flash {
      background: var(--danger-soft);
      border: 1px solid #f3c1bc;
      color: var(--danger);
      padding: 0.6rem 0.9rem;
      border-radius: 8px;
      list-style: none;
      margin: 0 0 1rem;
    }

    .card, .desejo-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.2rem;
      margin-bottom: 1rem;
      box-shadow: var(--shadow);
    }

    .progress-track { background: var(--accent-soft); border-radius: 4px; height: 10px; overflow: hidden; margin: 0.5rem 0; }
    .progress-fill { background: var(--accent); height: 100%; }
    .guardar-form { display: inline-flex; gap: 0.3rem; align-items: center; }
    .guardar-form input { width: 6rem; }

    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.2rem; box-shadow: var(--shadow); }
    .stat-card .label { font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
    .stat-card .value { font-size: 1.5rem; font-weight: 700; margin-top: 0.3rem; }
    .stat-card .value.positivo { color: var(--accent); }
    .stat-card .value.negativo { color: var(--danger); }

    .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem; }
    .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.2rem; box-shadow: var(--shadow); }
    @media (max-width: 640px) { .chart-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1><a href="{{ url_for('dashboard.index') }}">Bússola Financeira</a></h1>
  <nav>
    <a href="{{ url_for('dashboard.index') }}">Dashboard</a>
    <a href="{{ url_for('main.index') }}">Entradas e saídas</a>
    <a href="{{ url_for('fixos.listar') }}">Gastos fixos</a>
    <a href="{{ url_for('desejos.listar') }}">Lista de desejos</a>
    <a href="{{ url_for('faturas.ver') }}">Faturas</a>
  </nav>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <ul class="flash">
        {% for mensagem in messages %}
          <li>{{ mensagem }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}
</body>
</html>
