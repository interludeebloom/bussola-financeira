<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bússola Financeira</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.4rem; border-bottom: 1px solid #ccc; }
    form.inline { display: inline; }
    .flash { color: #a00; }
    label { display: block; margin-bottom: 0.8rem; }
    .desejo-card { border: 1px solid #ccc; border-radius: 6px; padding: 0.8rem 1rem; margin-bottom: 1rem; }
    .progress-track { background: #eee; border-radius: 4px; height: 10px; overflow: hidden; margin: 0.5rem 0; }
    .progress-fill { background: #2a7; height: 100%; }
    .guardar-form { display: inline-flex; gap: 0.3rem; align-items: center; }
    .guardar-form input { width: 6rem; }
  </style>
</head>
<body>
  <h1><a href="{{ url_for('main.index') }}">Bússola Financeira</a></h1>
  <nav>
    <a href="{{ url_for('main.index') }}">Entradas e saídas</a> ·
    <a href="{{ url_for('fixos.listar') }}">Gastos fixos</a> ·
    <a href="{{ url_for('desejos.listar') }}">Lista de desejos</a> ·
    <a href="{{ url_for('faturas.ver') }}">Faturas</a>
  </nav>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <ul class="flash">
        {% for mensagem in messages %}
          <li>{{ mensagem }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}
</body>
</html>
