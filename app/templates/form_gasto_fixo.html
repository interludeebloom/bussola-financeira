{% extends "base.html" %}

{% block content %}
  <h2>{% if gasto %}Editar gasto fixo{% else %}Novo gasto fixo{% endif %}</h2>

  <form method="post">
    <label>
      Nome
      <input type="text" name="nome" value="{{ valores.nome }}" required>
    </label>

    <label>
      Valor (R$)
      <input type="number" step="0.01" min="0.01" name="valor" value="{{ valores.valor }}" required>
    </label>

    <label>
      Dia de vencimento
      <input type="number" min="1" max="31" name="dia_vencimento" value="{{ valores.dia_vencimento }}" required>
    </label>

    <button type="submit">Salvar</button>
    <a href="{{ url_for('fixos.listar') }}">Cancelar</a>
  </form>
{% endblock %}
