{% extends "base.html" %}

{% block content %}
  <h2>{% if desejo %}Editar desejo{% else %}Novo desejo{% endif %}</h2>

  <form method="post">
    <label>
      Nome
      <input type="text" name="nome" value="{{ valores.nome }}" required>
    </label>

    <label>
      Preço (R$)
      <input type="number" step="0.01" min="0.01" name="preco" value="{{ valores.preco }}" required>
    </label>

    <label>
      Comprar até
      <input type="date" name="data_meta" value="{{ valores.data_meta }}" required>
    </label>

    <button type="submit">Salvar</button>
    <a href="{{ url_for('desejos.listar') }}">Cancelar</a>
  </form>
{% endblock %}
