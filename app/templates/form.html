{% extends "base.html" %}

{% block content %}
  <h2>{% if transacao %}Editar transação{% else %}Nova transação{% endif %}</h2>

  <form method="post">
    <label>
      Descrição
      <input type="text" name="descricao" value="{{ valores.descricao }}" required>
    </label>

    <label>
      Valor (R$)
      <input type="number" step="0.01" min="0.01" name="valor" value="{{ valores.valor }}" required>
    </label>

    <label>
      Tipo
      <select name="tipo">
        <option value="receita" {% if valores.tipo == "receita" %}selected{% endif %}>Receita</option>
        <option value="despesa" {% if valores.tipo == "despesa" %}selected{% endif %}>Despesa</option>
      </select>
    </label>

    <label>
      Data
      <input type="date" name="data" value="{{ valores.data }}" required>
    </label>

    <button type="submit">Salvar</button>
    <a href="{{ url_for('main.index') }}">Cancelar</a>
  </form>
{% endblock %}
